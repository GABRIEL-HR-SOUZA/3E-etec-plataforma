# =====================================================================
# Portal de Vagas ETEC Cuiabá — Configuração Quarkus (Modo JVM + SQLite)
# =====================================================================
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Limite de upload de currículo PDF: 5 MB (Regra LGPD e Segurança)
quarkus.http.limits.max-body-size=6M

# CORS para o Front-end Angular
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition

# Documentação SmallRye OpenAPI / Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.info-title=Portal de Vagas ETEC Cuiabá — API Oficial
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API central do Portal de Vagas e Estágios da ETEC Cuiabá (SECITECI/MT). Aplica moderação, Lei do Estágio (11.788/2008), LGPD (13.709/2018) e geração de Termos de Compromisso em PDF.

# Banco de Dados SQLite (Modo WAL + busy_timeout) e pasta privada de PDFs
etec.db.path=./data/etec_vagas.db
etec.backup.dir=./data/backups
etec.storage.dir=./storage/private_pdfs

# Chave dos tokens JWT (defina ETEC_JWT_SECRET com 32+ caracteres em produção)
etec.jwt.secret=${ETEC_JWT_SECRET:}
